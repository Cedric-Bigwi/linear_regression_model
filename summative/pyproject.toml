[project]
name = "air-demand-gap-finder"
version = "0.1.0"
description = "Predicts a country's yearly air passengers from economic indicators"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "joblib==1.6.0",
]

[dependency-groups]
notebook = ["jupyter", "matplotlib", "seaborn", "openpyxl"]
